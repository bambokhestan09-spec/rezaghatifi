<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEDA CHOLHA - ALL YOU CAN PLAY</title>
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-blue: #071933;
            --dark-blue: #040d1a;
            --accent-red: #ff334b;
            --accent-gold: #f39c12;
            --card-bg: rgba(13, 31, 60, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-white: #ffffff;
            --paper-bg: #fdfbf7;
            --paper-text: #1f1f1f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #0d2847 0%, var(--dark-blue) 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--text-white);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            padding: 20px;
            text-align: center;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: pulseSplash 2.5s ease-in-out infinite;
        }

        .splash-title {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 20px rgba(243, 156, 18, 0.4));
            text-align: center;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .loading-dots span {
            width: 10px;
            height: 10px;
            background-color: var(--text-white);
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1.0); opacity: 1; background-color: var(--accent-gold); box-shadow: 0 0 10px var(--accent-gold); }
        }

        @keyframes pulseSplash {
            0%, 100% { transform: scale(0.98); opacity: 0.95; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Body & Layout */
        body {
            background-color: var(--bg-blue);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(29, 78, 216, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(211, 47, 47, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 30%, #0f3057 0%, var(--bg-blue) 90%);
            color: var(--text-white);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        /* Header Styles */
        header {
            text-align: center;
            padding: 10px 10px 25px;
        }
